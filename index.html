<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scientific Calculator</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<main class="calculator">

<header class="calculator-header">
<h1>Scientific Calculator</h1>
<span class="mode">DEG</span>
</header>

<section class="display">
<div class="expression" id="expression"></div>
<div class="result" id="result">0</div>
</section>

<section class="scientific-buttons">

<button class="function">sin</button>
<button class="function">cos</button>
<button class="function">tan</button>
<button class="function">log</button>
<button class="function">ln</button>

<button class="function">√</button>
<button class="function">x²</button>
<button class="function">xʸ</button>
<button class="function">π</button>
<button class="function">e</button>

</section>

<section class="main-buttons">

<button class="danger">AC</button>
<button class="control">DEL</button>
<button class="control">(</button>
<button class="control">)</button>
<button class="operator">÷</button>

<button>7</button>
<button>8</button>
<button>9</button>
<button class="operator">×</button>
<button class="operator">%</button>

<button>4</button>
<button>5</button>
<button>6</button>
<button class="operator">−</button>
<button class="operator">+</button>

<button>1</button>
<button>2</button>
<button>3</button>
<button class="operator">^</button>
<button class="equals">=</button>

<button class="zero">0</button>
<button>.</button>

</section>

<footer>
<span>Scientific Calculator</span>
<span>DEG</span>
</footer>

</main>

<script src="script.js"></script>

</body>
</html>
